<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Ash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .landing {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
    }
    .landing h1 {
      font-family: var(--font-display);
      font-size: 4rem;
      margin: 0;
      letter-spacing: 0.02em;
    }
    .landing .hint {
      margin-top: 14px;
      color: var(--text-dim);
      font-size: 0.95rem;
      transition: opacity 0.3s ease;
    }
    .nav-reveal {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    body.open .landing { opacity: 0; pointer-events: none; }
    body.open .nav-reveal { opacity: 1; pointer-events: all; }

    .nav-reveal a {
      font-family: var(--font-display);
      font-size: 1.6rem;
      text-decoration: none;
      padding: 10px 0;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.5s ease forwards;
    }
    .nav-reveal a:hover { border-color: var(--thread); }
    .nav-reveal a:nth-child(1) { animation-delay: 0.05s; }
    .nav-reveal a:nth-child(2) { animation-delay: 0.15s; }
    .nav-reveal a:nth-child(3) { animation-delay: 0.25s; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-reveal a { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <div class="landing" id="landing">
    <h1>Ash</h1>
    <div class="hint">tap to look inside</div>
  </div>

  <nav class="nav-reveal">
    <a href="about.html">About</a>
    <a href="engineering.html">Engineering</a>
    <a href="hobbies.html">Hobbies</a>
  </nav>

  <script src="assets/script.js"></script>
</body>
</html>
