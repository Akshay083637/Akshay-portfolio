<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Ash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .landing {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .landing h1 {
      font-family: var(--font-display);
      font-size: 4rem;
      margin: 0;
      letter-spacing: 0.02em;
    }
    .landing .hint {
      margin-top: 14px;
      color: var(--text-dim);
      font-size: 0.95rem;
      transition: opacity 0.3s ease;
    }

    /* ---------- Balloons ---------- */
    .balloon {
      position: absolute;
      width: 64px;
      height: 78px;
      cursor: pointer;
      animation: float 6s ease-in-out infinite;
    }
    .balloon svg { width: 100%; height: 100%; display: block; }
    .balloon.b1 { left: 18%;  top: 28%;  animation-duration: 6.5s; animation-delay: 0s; }
    .balloon.b2 { left: 72%;  top: 20%;  animation-duration: 7.5s; animation-delay: 0.6s; }
    .balloon.b3 { left: 46%;  top: 62%;  animation-duration: 5.8s; animation-delay: 1.1s; }

    @keyframes float {
      0%   { transform: translateY(0) rotate(-2deg); }
      50%  { transform: translateY(-22px) rotate(2deg); }
      100% { transform: translateY(0) rotate(-2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .balloon { animation: none; }
    }
    .balloon:hover { filter: brightness(1.15); }

    /* ---------- Code modal ---------- */
    .code-modal {
      position: fixed;
      inset: 0;
      background: rgba(22, 35, 46, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .code-modal.open { display: flex; }
    .code-box {
      background: var(--ink-soft);
      border: 1px solid rgba(110, 147, 180, 0.35);
      border-radius: 8px;
      padding: 32px 36px;
      text-align: center;
      max-width: 280px;
    }
    .code-box p {
      margin: 0 0 16px;
      color: var(--paper);
      font-family: var(--font-display);
      font-size: 1.1rem;
    }
    .code-box input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 0.3em;
      border-radius: 4px;
      border: 1px solid rgba(110, 147, 180, 0.4);
      background: var(--ink);
      color: var(--paper);
      margin-bottom: 14px;
    }
    .code-box button {
      padding: 10px 20px;
      background: var(--thread);
      color: var(--ink);
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    .code-box button:hover { background: var(--thread-soft); }
    .code-error {
      color: #e07a5f;
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 1em;
    }
    .code-box.shake { animation: shake 0.4s ease; }
    @keyframes shake {
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .nav-reveal {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    body.open .landing { opacity: 0; pointer-events: none; }
    body.open .nav-reveal { opacity: 1; pointer-events: all; }

    .nav-reveal a {
      font-family: var(--font-display);
      font-size: 1.6rem;
      text-decoration: none;
      padding: 10px 0;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.5s ease forwards;
    }
    .nav-reveal a:hover { border-color: var(--thread); }
    .nav-reveal a:nth-child(1) { animation-delay: 0.05s; }
    .nav-reveal a:nth-child(2) { animation-delay: 0.15s; }
    .nav-reveal a:nth-child(3) { animation-delay: 0.25s; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-reveal a { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <div class="landing" id="landing">
    <h1>Ash</h1>
    <div class="hint">find the right balloon</div>

    <div class="balloon b1" data-color="blue">
      <svg viewBox="0 0 64 78"><ellipse cx="32" cy="32" rx="26" ry="30" fill="#6e93b4"/><path d="M32 62 L28 70 L36 70 Z" fill="#6e93b4"/><line x1="32" y1="70" x2="32" y2="78" stroke="#a9b8c4" stroke-width="1.5"/></svg>
    </div>

    <div class="balloon b2" id="yellow-balloon" data-color="yellow">
      <svg viewBox="0 0 64 78"><ellipse cx="32" cy="32" rx="26" ry="30" fill="#f2c94c"/><path d="M32 62 L28 70 L36 70 Z" fill="#f2c94c"/><line x1="32" y1="70" x2="32" y2="78" stroke="#a9b8c4" stroke-width="1.5"/></svg>
    </div>

    <div class="balloon b3" data-color="rust">
      <svg viewBox="0 0 64 78"><ellipse cx="32" cy="32" rx="26" ry="30" fill="#a8553a"/><path d="M32 62 L28 70 L36 70 Z" fill="#a8553a"/><line x1="32" y1="70" x2="32" y2="78" stroke="#a9b8c4" stroke-width="1.5"/></svg>
    </div>
  </div>

  <div class="code-modal" id="code-modal">
    <div class="code-box" id="code-box">
      <p>Enter the code</p>
      <input type="text" inputmode="numeric" maxlength="4" id="code-input" autocomplete="off">
      <br>
      <button id="code-submit">Unlock</button>
      <div class="code-error" id="code-error"></div>
    </div>
  </div>

  <nav class="nav-reveal">
    <a href="about.html">About</a>
    <a href="engineering.html">Engineering</a>
    <a href="hobbies.html">Hobbies</a>
  </nav>

  <script src="assets/script.js"></script>
  <script>
    (function () {
      var yellowBalloon = document.getElementById('yellow-balloon');
      var modal = document.getElementById('code-modal');
      var box = document.getElementById('code-box');
      var input = document.getElementById('code-input');
      var submit = document.getElementById('code-submit');
      var error = document.getElementById('code-error');
      var THE_CODE = '2345';

      yellowBalloon.addEventListener('click', function () {
        modal.classList.add('open');
        input.value = '';
        error.textContent = '';
        input.focus();
      });

      function tryCode() {
        if (input.value.trim() === THE_CODE) {
          modal.classList.remove('open');
          document.body.classList.add('open');
        } else {
          error.textContent = 'Not quite.';
          box.classList.remove('shake');
          void box.offsetWidth; // restart animation
          box.classList.add('shake');
        }
      }

      submit.addEventListener('click', tryCode);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') tryCode();
      });

      // Clicking the modal backdrop (not the box) just closes it — site stays inert
      modal.addEventListener('click', function (e) {
        if (e.target === modal) modal.classList.remove('open');
      });
    })();
  </script>

  <!-- Handles invite/password links from Netlify Identity emails -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      netlifyIdentity.on('init', function (user) {
        // If the URL contains an invite or recovery token, the widget
        // auto-opens the "set password" screen on load.
      });
      netlifyIdentity.on('login', function () {
        window.location.href = '/admin/';
      });
    }
  </script>
</body>
</html>
